<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>光復國小 運動專長檢核</title>
<meta name="description" content="臺北市信義區光復國民小學 一生一專長 運動專長檢核系統">
<meta name="theme-color" content="#16307d">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="光復運動專長">
<style>
:root{--brand:#16307d;--brand-2:#2a4bb8;--ink:#1a2230;--ink-3:#818da4;--line:#dde3ee}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  background:#f2f5fa;color:var(--ink);display:grid;place-items:center;
  min-height:100svh;padding:24px calc(16px + env(safe-area-inset-left)) 24px;
  text-align:center
}
.box{max-width:340px;width:100%}
.logo{width:120px;height:120px;display:block;margin:0 auto 18px;filter:drop-shadow(0 6px 16px rgba(22,48,125,.18))}
p.pre{margin:0 0 2px;font-size:13px;color:var(--ink-3);letter-spacing:2px}
h1{font-size:26px;margin:0 0 4px;letter-spacing:4px;text-indent:4px;font-weight:900;color:var(--brand)}
p.sub{margin:0;font-size:13.5px;color:var(--ink-3);letter-spacing:.5px}
.bar{height:4px;border-radius:2px;margin:18px auto;max-width:180px;
  background:linear-gradient(90deg,#2a78d6 0 25%,#eb6834 25% 50%,#1baf7a 50% 75%,#eda100 75% 100%)}
a.go{display:block;margin:0 auto;padding:14px 20px;border-radius:12px;text-decoration:none;
  background:linear-gradient(140deg,var(--brand-2),var(--brand));color:#fff;font-weight:700;
  font-size:16px;box-shadow:0 3px 12px rgba(22,48,125,.28)}
a.go:active{opacity:.85}
.status{margin-top:14px;font-size:13px;color:var(--ink-3);min-height:20px}
.how{margin:10px 0 0;font-size:12.5px;color:var(--ink-3);line-height:1.7}
.how a{color:var(--brand-2)}
.tip{margin-top:26px;font-size:12.5px;color:var(--ink-3);line-height:1.8;
  border-top:1px solid var(--line);padding-top:16px;text-align:left}
.tip b{color:var(--ink)}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);
  border-top-color:var(--brand);border-radius:50%;animation:s .8s linear infinite;
  vertical-align:-2px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box">
  <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="運動專長檢核圖示"><defs><clipPath id="cl"><rect width="512" height="512" rx="112"/></clipPath></defs><g clip-path="url(#cl)"><rect width="512" height="512" fill="#eef2f8"/><rect x="34" y="34" width="206" height="206" rx="54" fill="#2a78d6"/><g transform="translate(28 36) scale(.42)"><g stroke="#fff" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M290 182 L250 284"/><path d="M288 196 L346 236 L376 198"/><path d="M282 200 L222 220 L190 262"/><path d="M250 284 L320 318 L302 394"/><path d="M250 284 L214 352 L148 362"/></g><circle cx="322" cy="120" r="44" fill="#fff"/></g><rect x="272" y="34" width="206" height="206" rx="54" fill="#eb6834"/><g fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round"><circle cx="378" cy="136" r="62"/><path d="M316 136 H440"/><path d="M378 74 V198"/><path d="M334 92 Q362 136 334 180"/><path d="M422 92 Q394 136 422 180"/></g><rect x="34" y="272" width="206" height="206" rx="54" fill="#1baf7a"/><g transform="rotate(-35 128 380)"><circle cx="128" cy="352" r="56" fill="#fff"/><rect x="116" y="398" width="24" height="58" rx="12" fill="#fff"/></g><circle cx="186" cy="310" r="17" fill="#fff"/><rect x="272" y="272" width="206" height="206" rx="54" fill="#eda100"/><g transform="translate(312 440) rotate(-48)"><circle cx="-6" cy="0" r="14" fill="#fff"/><path d="M0 -8 L64 -8 L138 -20 Q166 -20 166 0 Q166 20 138 20 L64 8 L0 8 Z" fill="#fff"/></g><circle cx="340" cy="320" r="21" fill="#fff"/></g></svg>
  <p class="pre">光復國小・一生一專長</p>
  <h1>運動專長檢核</h1>
  <p class="sub">田徑・籃球・桌球・樂樂棒球</p>
  <div class="bar"></div>

  <a class="go" id="go" href="#">用學校帳號登入，開啟系統</a>
  <p class="how">會先請你選擇 <b>@kfps.tp.edu.tw</b> 學校帳號；<br>沒有看到自己的帳號，請按「使用其他帳戶」登入。<br>
    <a id="direct" href="#">已登入學校帳號？直接開啟</a></p>
  <div class="status" id="status"><span class="spin"></span>正在開啟…</div>

  <div class="tip" id="tip" hidden>
    <b>把它加到主畫面</b><br>
    iPhone：Safari 下方「分享」→ 加入主畫面<br>
    Android：Chrome 右上「⋮」→ 安裝應用程式／加到主畫面<br>
    <span style="font-size:12px">（之前直接把系統網頁加到主畫面的，請先刪掉舊的，再從這一頁加一次，圖示才會出現）</span>
  </div>
</div>

<script>
/* 運動專長檢核系統網址。改版換網址時只要改這一行。 */
const APP_URL = 'https://script.google.com/a/macros/kfps.tp.edu.tw/s/AKfycbxQv7HhazIrCMoHJmhqR3leyrlYdm0B7dokaYirS6LRRRtFNEmZa3diDZfVfGNuOHw2xg/exec';
/* 系統只開放學校網域帳號：瀏覽器只登入個人 Gmail 時，直接開 APP_URL 會被 Google 擋下。
   所以先經過 Google 帳戶選擇頁（hd＝只列學校網域的帳號，也可「使用其他帳戶」登入），選好後自動回到系統。 */
const LOGIN_URL = 'https://accounts.google.com/AccountChooser?hd=kfps.tp.edu.tw&continue=' + encodeURIComponent(APP_URL);

document.getElementById('go').href = LOGIN_URL;
document.getElementById('direct').href = APP_URL;

const standalone = window.matchMedia('(display-mode: standalone)').matches ||
                   window.navigator.standalone === true;

// 已加到主畫面（獨立視窗）才自動跳轉；在瀏覽器裡瀏覽時停在這頁，方便使用者加到主畫面
const statusEl = document.getElementById('status');
/* 轉圈只在剛開啟的一兩秒顯示；沒跳過去（或從系統返回這頁）就改成提示按按鈕 */
function idle() { statusEl.textContent = '沒有自動開啟的話，請按上方「開啟系統」'; }
if (standalone) {
  setTimeout(() => location.replace(LOGIN_URL), 300);
  setTimeout(idle, 2500);
  window.addEventListener('pageshow', e => { if (e.persisted) idle(); });
} else {
  statusEl.textContent = '';
  document.getElementById('tip').hidden = false;
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
</body>
</html>
