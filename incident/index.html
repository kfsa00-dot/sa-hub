function NewIncidentView({ today, onCancel, onCreate }) {
  const [type, setType] = useState(null);
  const [name, setName] = useState("");
  const [date, setDate] = useState("");
  const [touched, setTouched] = useState(false);

  const todayStr = toDateInputValue(today);
  const parsedDate = parseDate(date);
  const errors = {
    type: !type ? "請選擇事件類型" : null,
    name: !name.trim() ? "請輸入案件名稱" : name.trim().length > NAME_MAX ? `案件名稱請勿超過 ${NAME_MAX} 字` : null,
    date: !date ? "請選擇事件發生日期"
      : !parsedDate ? "日期格式不正確"
      : date > todayStr ? "事件發生日期不可晚於今天"
      : null
  };
  const hasError = Object.values(errors).some(Boolean);

  const submit = e => {
    e.preventDefault();
    setTouched(true);
    if (hasError) return;
    const now = new Date().toISOString();
    onCreate({
      id: uuid(),
      type,
      name: name.trim(),
      incidentDate: date,
      checkedSteps: {},
      notes: {},
      assignees: {},
      activityLog: [{ id: uuid(), timestamp: now, content: "🆕 案件建立", type: "auto" }],
      status: "active",
      closedAt: null,
      createdAt: now
    });
  };

  return (
    <>
      <header className="app-header">
        <h1 className="app-title" style={{ margin: 0 }}>
          <span className="logo" aria-hidden="true">📝</span>
          新增案件
        </h1>
        <button className="btn btn-ghost" onClick={onCancel}>← 返回</button>
      </header>

      <form className="panel" onSubmit={submit} noValidate>
        <h2><span className="step-badge">1</span>選擇事件類型</h2>
        <div className="step-hint">請選擇此次事件對應的法規類型，系統將自動套用相應的處理流程。</div>
        <div className="type-grid" role="radiogroup" aria-label="事件類型">
          {Object.entries(INCIDENT_TYPES).map(([key, t]) => (
            <button
              type="button"
              key={key}
              role="radio"
              aria-checked={type === key}
              className={"type-btn" + (type === key ? " selected" : "")}
              style={type === key ? { borderColor: t.color, "--type-color": t.color } : null}
              onClick={() => setType(key)}
            >
              <span className="ic" aria-hidden="true">{t.icon}</span>
              <span className="nm" style={type === key ? { color: t.color } : null}>{t.name}</span>
              <div className="desc">{t.desc}</div>
            </button>
          ))}
        </div>
        {touched && errors.type && <div className="field-error" style={{ marginTop: -22, marginBottom: 20 }}>{errors.type}</div>}

        <h2><span className="step-badge">2</span>輸入案件資訊</h2>
        <div className="step-hint">案件名稱僅供識別用途，建議使用代號（如 115-001），避免輸入學生姓名等可識別個資。</div>

        <div className="form-grid">
          <div className="form-row">
            <label htmlFor="case-name">案件名稱<span className="req">*</span></label>
            <input
              id="case-name"
              type="text"
              placeholder="例：115-001 / 五年級霸凌案"
              value={name}
              maxLength={NAME_MAX + 10}
              aria-invalid={touched && !!errors.name}
              onChange={e => setName(e.target.value)}
            />
            {touched && errors.name
              ? <div className="field-error">{errors.name}</div>
              : <div className="field-help">{name.trim().length} / {NAME_MAX} 字</div>}
          </div>
          <div className="form-row">
            <label htmlFor="case-date">事件發生日期<span className="req">*</span></label>
            <input
              id="case-date"
              type="date"
              value={date}
              max={todayStr}
              aria-invalid={touched && !!errors.date}
              onChange={e => setDate(e.target.value)}
            />
            {touched && errors.date
              ? <div className="field-error">{errors.date}</div>
              : <div className="field-help">所有期限皆由此日起算</div>}
          </div>
        </div>

        <div className="form-actions">
          <button type="button" className="btn btn-secondary" onClick={onCancel}>取消</button>
          <button type="submit" className="btn btn-primary">建立案件 →</button>
        </div>
      </form>
    </>
  );
}

/* ==========================================================
   畫面 C：流程檢核
========================================================== */

function ProcessCheckView({ incident, today, notify, onBack, onUpdate }) {
  const [filter, setFilter] = useState("all");
  const [fabOpen, setFabOpen] = useState(false);
  const [printing, setPrinting] = useState(false);
  const [logExpanded, setLogExpanded] = useState(false);
  const [newLogText, setNewLogText] = useState("");
  const [closeModal, setCloseModal] = useState(null);
  const [reopenConfirm, setReopenConfirm] = useState(false);
  const [delLogId, setDelLogId] = useState(null);
  const fabRef = useRef(null);

  // 列印前先切回「全部」，待畫面更新後再呼叫列印，確保印出完整步驟清單
  useEffect(() => {
    if (!printing) return;
    const done = () => setPrinting(false);
    window.addEventListener("afterprint", done, { once: true });
    const t = setTimeout(() => { window.print(); done(); }, 50);
    return () => { clearTimeout(t); window.removeEventListener("afterprint", done); };
  }, [printing]);

  useEffect(() => {
    if (!fabOpen) return;
    const onKey = e => { if (e.key === "Escape") setFabOpen(false); };
    const onClick = e => { if (fabRef.current && !fabRef.current.contains(e.target)) setFabOpen(false); };
    document.addEventListener("keydown", onKey);
    document.addEventListener("mousedown", onClick);
    return () => { document.removeEventListener("keydown", onKey); document.removeEventListener("mousedown", onClick); };
  }, [fabOpen]);

  const typeConf = incident ? INCIDENT_TYPES[incident.type] : null;

  if (!incident || !typeConf) {
    return (
      <div className="empty-state">
        <div className="icon" aria-hidden="true">❓</div>
        <div className="text">{incident ? "此案件的事件類型無法辨識。" : "找不到案件，可能已被刪除。"}</div>
        <button className="btn btn-primary" onClick={onBack} style={{ marginTop: 16 }}>返回清單</button>
      </div>
    );
  }

  const isClosed = incident.status === "closed";

  const stepsWithStatus = typeConf.steps.map(step => ({
    step,
    status: getStepStatus(typeConf, step, incident, today)
  }));

  const counts = stepsWithStatus.reduce((acc, x) => {
    acc[x.status.key] = (acc[x.status.key] || 0) + 1;
    return acc;
  }, { overdue: 0, soon: 0, todo: 0, done: 0 });

  const total = typeConf.steps.length;
  const percent = Math.round((counts.done / total) * 100);
  const allDone = counts.done === total;
  const todoLabel = isClosed ? "未完成" : "待辦";

  const activeFilter = printing ? "all" : filter;
  const filtered = stepsWithStatus.filter(x => activeFilter === "all" || x.status.key === activeFilter);

  const toggleCheck = (stepId) => {
    if (isClosed) return;
    onUpdate(inc => {
      const next = { ...inc.checkedSteps };
      const stepName = typeConf.steps.find(s => s.id === stepId)?.name || `步驟 ${stepId}`;
      let logContent;
      if (next[stepId]) {
        delete next[stepId];
        logContent = `↩️ 步驟${stepId}「${stepName}」取消完成`;
      } else {
        next[stepId] = true;
        logContent = `✅ 步驟${stepId}「${stepName}」已完成`;
      }
      return appendLog({ ...inc, checkedSteps: next }, logContent, "auto");
    });
  };
  const updateNote = (stepId, text) => {
    if (isClosed) return;
    onUpdate(inc => {
      const next = { ...inc.notes };
      if (text && text.trim()) next[stepId] = text.slice(0, NOTE_MAX);
      else delete next[stepId];
      return { ...inc, notes: next };
    });
  };
  const updateAssignee = (stepId, val) => {
    if (isClosed) return;
    onUpdate(inc => {
      const next = { ...(inc.assignees || {}) };
      if (val) next[stepId] = val;
      else delete next[stepId];
      return { ...inc, assignees: next };
    });
  };

  const addManualLog = () => {
    const text = newLogText.trim();
    if (!text || isClosed) return;
    onUpdate(inc => appendLog(inc, text.slice(0, LOG_TEXT_MAX), "manual"));
    setNewLogText("");
  };
  const deleteLog = (logId) => {
    onUpdate(inc => ({
      ...inc,
      activityLog: (inc.activityLog || []).filter(l => l.id !== logId)
    }));
    setDelLogId(null);
  };

  const requestClose = () => {
    const missing = typeConf.steps.filter(s =>
      s.required && !(incident.checkedSteps && incident.checkedSteps[s.id])
    );
    setCloseModal({ missing });
  };
  const confirmClose = () => {
    onUpdate(inc => {
      const closed = { ...inc, status: "closed", closedAt: new Date().toISOString() };
      return appendLog(closed, "🏁 案件結案", "auto");
    });
    setCloseModal(null);
    notify("案件已結案");
  };
  const confirmReopen = () => {
    onUpdate(inc => {
      const opened = { ...inc, status: "active", closedAt: null };
      return appendLog(opened, "🔄 案件重新開啟", "auto");
    });
    setReopenConfirm(false);
    notify("案件已重新開啟");
  };

  const doPrint = () => { setFabOpen(false); setPrinting(true); };
  const doExportCSV = () => {
    setFabOpen(false);
    try {
      const csv = buildCaseCsv(incident, typeConf, today);
      downloadBlob(new Blob([csv], { type: "text/csv;charset=utf-8;" }),
        `${safeFileName(incident.name)}_${toDateInputValue(new Date())}.csv`);
      notify("已匯出 CSV");
    } catch (err) {
      console.error("CSV 匯出失敗", err);
      notify("CSV 匯出失敗，請再試一次。", "error");
    }
  };

  const logs = incident.activityLog || [];
  const pills = [
    { key: "overdue", label: "逾期", n: counts.overdue },
    { key: "soon", label: "即將到期", n: counts.soon },
    { key: "todo", label: todoLabel, n: counts.todo },
    { key: "done", label: "已完成", n: counts.done }
  ];

  return (
    <>
      <header className="app-header">
        <h1 className="app-title" style={{ margin: 0, fontSize: 20 }}>
          <span className="logo" style={{ background: typeConf.color, fontSize: 26 }} aria-hidden="true">{typeConf.icon}</span>
          流程檢核
        </h1>
        <div className="header-actions">
          {isClosed ? (
            <button className="btn btn-ghost" onClick={() => setReopenConfirm(true)}>🔄 重新開啟案件</button>
          ) : (
            <button className="btn btn-ghost" onClick={requestClose}>🏁 結案</button>
          )}
          <button className="btn btn-ghost" onClick={onBack}>← 返回清單</button>
        </div>
      </header>

      <section className="check-header">
        <div className="tags">
          <span className="type-tag" style={{ background: typeConf.color }}>
            <span aria-hidden="true">{typeConf.icon}</span>{typeConf.name}
          </span>
          {isClosed && (
            <span className="closed-badge">
              🏁 已結案{incident.closedAt ? `（${fmtDate(new Date(incident.closedAt))}）` : ""}
            </span>
          )}
        </div>
        <h2>{incident.name}</h2>
        <div className="meta">
          事件發生日：{fmtDate(parseDate(incident.incidentDate))}　·
          計算方式：{typeConf.dayMode === "work" ? "工作日（排除週六日）" : typeConf.dayMode === "mixed" ? "前段以小時計／後段日曆天" : "日曆天"}
          <span className="print-only">列印日期：{fmtDate(new Date())}　·　法規依據：{typeConf.desc}</span>
        </div>
      </section>

      {isClosed && (
        <div className="readonly-banner">
          🔒 此案件已結案，所有步驟、備注、負責人指派為唯讀狀態。如需修改請點右上「重新開啟案件」。
        </div>
      )}

      <section className="summary-bar" aria-label="進度總覽">
        <div className="summary-title">
          <span>整體進度 {counts.done} / {total}</span>
          <span className="pct">{percent}%</span>
        </div>
        <div className="progress-wrap" style={{ marginTop: 10 }} role="progressbar" aria-valuemin={0} aria-valuemax={total} aria-valuenow={counts.done} aria-label="完成進度">
          <div className="progress-bar" style={{ width: percent + "%" }} />
        </div>
        <div className="summary-row">
          {pills.map(p => (
            <button
              key={p.key}
              type="button"
              className={"summary-pill " + p.key}
              aria-pressed={filter === p.key}
              title={`只顯示「${p.label}」`}
              onClick={() => setFilter(f => f === p.key ? "all" : p.key)}
            >
              <span className="num">{p.n}</span>{p.label}
            </button>
          ))}
        </div>
      </section>

      {allDone && !isClosed && (
        <div className="banner allDone" role="status">🎉 所有步驟皆已完成，可點右上「結案」完成歸檔。</div>
      )}
      {!allDone && !isClosed && counts.overdue > 0 && (
        <div className="banner overdue" role="alert">⚠️ 有 {counts.overdue} 項步驟已逾期，請儘速處理！</div>
      )}
      {!allDone && !isClosed && counts.overdue === 0 && counts.soon > 0 && (
        <div className="banner soon" role="status">⏰ 有 {counts.soon} 項步驟即將到期（3日內）</div>
      )}

      <section className="activity-log-section">
        <button
          type="button"
          className="activity-log-header"
          aria-expanded={logExpanded}
          aria-controls="activity-log-body"
          onClick={() => setLogExpanded(x => !x)}
        >
          <span className="activity-log-title">
            <span>📒 處理日誌</span>
            <span className="log-badge">{logs.length}</span>
          </span>
          <span className="activity-log-toggle">{logExpanded ? "▲ 收合" : "▼ 展開"}</span>
        </button>
        {logExpanded && (
          <div className="activity-log-body" id="activity-log-body">
            {!isClosed && (
              <div className="log-input-row">
                <input
                  type="text"
                  value={newLogText}
                  maxLength={LOG_TEXT_MAX}
                  aria-label="新增處理紀錄"
                  onChange={e => setNewLogText(e.target.value)}
                  placeholder="輸入處理紀錄（如家長溝通、會議結論），按 Enter 新增"
                  onKeyDown={e => { if (e.key === "Enter" && !e.nativeEvent.isComposing) addManualLog(); }}
                />
                <button className="btn btn-primary btn-small" onClick={addManualLog} disabled={!newLogText.trim()}>新增紀錄</button>
              </div>
            )}
            {logs.length === 0 ? (
              <div className="log-empty">尚無日誌紀錄</div>
            ) : (
              <ul className="log-timeline">
                {logs.map(entry => (
                  <li key={entry.id} className={"log-entry " + (entry.type || "manual")}>
                    <time className="log-time" dateTime={entry.timestamp}>{formatLogTime(entry.timestamp)}</time>
                    <span className="log-content">{entry.content}</span>
                    {entry.type === "manual" && !isClosed && (
                      <button className="log-del" onClick={() => setDelLogId(entry.id)} aria-label="刪除此筆紀錄">刪除</button>
                    )}
                  </li>
                ))}
              </ul>
            )}
          </div>
        )}
      </section>

      <div className="filter-tabs" role="group" aria-label="依狀態篩選">
        {[
          { key: "all", label: `全部 (${total})` },
          { key: "overdue", label: `逾期 (${counts.overdue})` },
          { key: "soon", label: `即將到期 (${counts.soon})` },
          { key: "todo", label: `${todoLabel} (${counts.todo})` },
          { key: "done", label: `已完成 (${counts.done})` }
        ].map(t => (
          <button
            key={t.key}
            className={filter === t.key ? "active" : ""}
            aria-pressed={filter === t.key}
            onClick={() => setFilter(t.key)}
          >{t.label}</button>
        ))}
      </div>

      {filtered.length === 0 ? (
        <div className="empty-state" style={{ padding: "40px 20px" }}>
          <div className="text">此分類目前沒有步驟</div>
          <button className="btn btn-secondary" style={{ marginTop: 14 }} onClick={() => setFilter("all")}>顯示全部步驟</button>
        </div>
      ) : (
        filtered.map(({ step, status }) => (
          <StepCard
            key={step.id}
            step={step}
            status={status}
            deadlineText={formatDeadline(typeConf, step, incident.incidentDate)}
            note={incident.notes?.[step.id] || ""}
            assignee={incident.assignees?.[step.id] || ""}
            checked={!!incident.checkedSteps?.[step.id]}
            readOnly={isClosed}
            onToggle={() => toggleCheck(step.id)}
            onNoteChange={(text) => updateNote(step.id, text)}
            onAssigneeChange={(v) => updateAssignee(step.id, v)}
          />
        ))
      )}

      <div className="fab" ref={fabRef}>
        {fabOpen && (
          <div className="fab-menu" role="menu">
            <button role="menuitem" onClick={doPrint}>🖨️ 列印</button>
            <button role="menuitem" onClick={doExportCSV}>📊 匯出 CSV</button>
          </div>
        )}
        <button
          className="fab-main"
          onClick={() => setFabOpen(o => !o)}
          aria-haspopup="menu"
          aria-expanded={fabOpen}
          aria-label="列印 / 匯出"
        >
          <span aria-hidden="true">{fabOpen ? "✕" : "🖨️"}</span>
          <span className="fab-label">列印 / 匯出</span>
        </button>
      </div>

      {closeModal && (
        <CloseCaseModal
          missing={closeModal.missing}
          onCancel={() => setCloseModal(null)}
          onConfirm={confirmClose}
        />
      )}
      {reopenConfirm && (
        <ConfirmModal
          title="重新開啟案件？"
          message="重新開啟後，所有步驟、備注、負責人欄位將恢復可編輯狀態，並會在處理日誌留下紀錄。"
          confirmLabel="確認重啟"
          confirmClass="btn-primary"
          onCancel={() => setReopenConfirm(false)}
          onConfirm={confirmReopen}
        />
      )}
      {delLogId && (
        <ConfirmModal
          title="刪除這筆日誌？"
          message="刪除後無法復原。"
          onCancel={() => setDelLogId(null)}
          onConfirm={() => deleteLog(delLogId)}
        />
      )}
    </>
  );
}

/* ==========================================================
   單一步驟卡片
========================================================== */

const ASSIGNEE_OPTIONS = ["學務主任", "生教組", "輔導室", "導師", "其他"];

function StepCard({ step, status, deadlineText, note, assignee, checked, readOnly, onToggle, onNoteChange, onAssigneeChange }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(note);

  useEffect(() => { setDraft(note); }, [note]);
  useEffect(() => { if (readOnly) setEditing(false); }, [readOnly]);

  const cardCls = `step-card s-${status.key}` + (readOnly ? " readonly" : "");
  const statusTagCls = `status-tag s-${status.key}`;
  const hourBased = typeof step.hours !== "undefined";
  const dayHint = status.key === "done" || hourBased ? null : describeDays(status.days);

  const save = () => { onNoteChange(draft); setEditing(false); };
  const cancel = () => { setDraft(note); setEditing(false); };
  const onNoteKey = e => {
    if (e.key === "Escape") { e.preventDefault(); cancel(); }
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); save(); }
  };
  const selectId = `assignee-${step.id}`;

  return (
    <article className={cardCls}>
      <div className="step-head">
        <button
          type="button"
          role="checkbox"
          aria-checked={checked}
          aria-label={`步驟 ${step.id}：${step.name}`}
          className={"step-check" + (checked ? " checked" : "")}
          onClick={onToggle}
          disabled={readOnly}
          title={readOnly ? "案件已結案，無法修改" : (checked ? "點擊取消完成" : "點擊標記為完成")}
        >{checked ? "✓" : ""}</button>
        <div className="step-body">
          <div className="step-title-row">
            <span className="step-num">{step.id}</span>
            <span className="step-title">{step.name}</span>
            {step.required && <span className="req-tag">必要</span>}
            <span className={statusTagCls}>{status.label}</span>
            {assignee && <span className="assignee-tag">👤 {assignee}</span>}
          </div>

          <div className="step-deadline">
            <strong>截止：</strong>{deadlineText}
            {dayHint && <span className={"days " + dayHint.tone}>{dayHint.text}</span>}
          </div>

          {step.law && <div className="step-law">📖 {step.law}</div>}

          {step.composition && (
            <div className="composition-note">
              <strong>📋 組成條件：</strong>{step.composition}
            </div>
          )}

          {step.crossSchoolNote && (
            <div className="cross-school-note">
              <strong>🔗 跨校提示：</strong>{step.crossSchoolNote}
            </div>
          )}

          {!readOnly && (
            <div className="assignee-row">
              <label htmlFor={selectId}>負責人：</label>
              <select
                id={selectId}
                className="assignee-select"
                value={assignee || ""}
                onChange={e => onAssigneeChange(e.target.value)}
              >
                <option value="">未指定</option>
                {ASSIGNEE_OPTIONS.map(o => <option key={o} value={o}>{o}</option>)}
              </select>
            </div>
          )}

          <div className="note-section">
            {!editing && note && (
              <div className="note-display">📝 {note}</div>
            )}
            {!editing && !readOnly && (
              <button className="note-toggle" onClick={() => setEditing(true)}>
                {note ? "✏️ 編輯備注" : "＋ 新增備注"}
              </button>
            )}
            {editing && !readOnly && (
              <div className="note-edit">
                <textarea
                  value={draft}
                  maxLength={NOTE_MAX}
                  aria-label={`步驟 ${step.id} 備注`}
                  onChange={e => setDraft(e.target.value)}
                  onKeyDown={onNoteKey}
                  placeholder="輸入處理紀錄、會議結果、聯繫對象等備注…（Ctrl/⌘ + Enter 儲存，Esc 取消）"
                  autoFocus
                />
                <div className="note-actions">
                  <button className="btn btn-primary btn-small" onClick={save}>儲存</button>
                  <button className="btn btn-secondary btn-small" onClick={cancel}>取消</button>
                  <span className="note-count">{draft.length} / {NOTE_MAX}</span>
                </div>
              </div>
            )}
          </div>
        </div>
      </div>
    </article>
  );
}

/* ==========================================================
   彈窗
========================================================== */

// 共用對話框：Esc 關閉、開啟時聚焦、Tab 不會跳出對話框、關閉後焦點回到原按鈕
function Modal({ title, onCancel, children, maxWidth }) {
  const ref = useRef(null);
  const titleId = useMemo(() => "modal-title-" + uuid(), []);

  useEffect(() => {
    const previous = document.activeElement;
    const node = ref.current;
    const focusables = () => Array.from(node.querySelectorAll("button, input, select, textarea, [href]"))
      .filter(el => !el.disabled);
    const initial = node.querySelector("[data-autofocus]") || focusables()[0];
    if (initial) initial.focus();

    const onKey = e => {
      if (e.key === "Escape") { e.preventDefault(); onCancel(); return; }
      if (e.key !== "Tab") return;
      const list = focusables();
      if (list.length === 0) return;
      const first = list[0], last = list[list.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    };
    document.addEventListener("keydown", onKey);
    return () => {
      document.removeEventListener("keydown", onKey);
      if (previous && typeof previous.focus === "function") previous.focus();
    };
  }, []);

  return (
    <div className="modal-mask" onMouseDown={e => { if (e.target === e.currentTarget) onCancel(); }}>
      <div className="modal" role="dialog" aria-modal="true" aria-labelledby={titleId} ref={ref} style={maxWidth ? { maxWidth } : null}>
        <h3 id={titleId}>{title}</h3>
        {children}
      </div>
    </div>
  );
}

function ConfirmModal({ title, message, onCancel, onConfirm, confirmLabel, confirmClass }) {
  return (
    <Modal title={title} onCancel={onCancel}>
      <p>{message}</p>
      <div className="modal-actions">
        <button className="btn btn-secondary" data-autofocus onClick={onCancel}>取消</button>
        <button className={"btn " + (confirmClass || "btn-danger")} onClick={onConfirm}>
          {confirmLabel || "確認刪除"}
        </button>
      </div>
    </Modal>
  );
}

function CloseCaseModal({ missing, onCancel, onConfirm }) {
  const hasMissing = missing.length > 0;
  return (
    <Modal title={hasMissing ? "⚠️ 以下必要步驟尚未完成" : "🏁 確定結案？"} onCancel={onCancel} maxWidth={520}>
      <p>
        {hasMissing
          ? "下列步驟標記為「必要」但尚未勾選，確定要結案嗎？結案後步驟將無法修改。"
          : "所有必要步驟皆已完成。結案後步驟、備注、負責人指派將無法修改。"}
      </p>
      {hasMissing && (
        <ul className="missing-list">
          {missing.map(s => <li key={s.id}>步驟 {s.id}：{s.name}</li>)}
        </ul>
      )}
      <div className="modal-actions">
        <button className="btn btn-secondary" data-autofocus={hasMissing ? true : undefined} onClick={onCancel}>取消</button>
        <button
          className={hasMissing ? "btn btn-danger" : "btn btn-primary"}
          data-autofocus={hasMissing ? undefined : true}
          onClick={onConfirm}
        >{hasMissing ? "仍要結案" : "確認結案"}</button>
      </div>
    </Modal>
  );
}

/* ==========================================================
   側邊欄元件
========================================================== */

function Sidebar({ incidents, summaries, currentId, collapsed, onToggle, onSelect, onNew, manualOrder, setManualOrder }) {
  const active = useMemo(
    () => getSidebarOrderedActive(incidents, summaries, manualOrder),
    [incidents, summaries, manualOrder]
  );
  const closed = useMemo(
    () => incidents.filter(i => i.status === "closed" && summaries.has(i.id)),
    [incidents, summaries]
  );

  const move = (idx, dir) => {
    const target = idx + dir;
    if (target < 0 || target >= active.length) return;
    const ids = active.map(i => i.id);
    [ids[target], ids[idx]] = [ids[idx], ids[target]];
    setManualOrder(ids);
  };

  const renderCard = (inc, idx, isClosed) => collapsed ? (
    <SidebarIconCard
      key={inc.id}
      incident={inc}
      summary={summaries.get(inc.id)}
      active={inc.id === currentId}
      onClick={() => onSelect(inc.id)}
    />
  ) : (
    <SidebarCaseCard
      key={inc.id}
      incident={inc}
      summary={summaries.get(inc.id)}
      active={inc.id === currentId}
      onClick={() => onSelect(inc.id)}
      canUp={!isClosed && idx > 0}
      canDown={!isClosed && idx < active.length - 1}
      onUp={isClosed ? null : () => move(idx, -1)}
      onDown={isClosed ? null : () => move(idx, 1)}
    />
  );

  return (
    <aside className={"sidebar" + (collapsed ? " collapsed" : "")} aria-label="案件導覽">
      <div className="sidebar-header">
        {!collapsed && <span className="sidebar-header-title">📂 案件導覽</span>}
        <button
          className="sidebar-toggle"
          onClick={onToggle}
          aria-expanded={!collapsed}
          aria-label={collapsed ? "展開側邊欄" : "收合側邊欄"}
          title={collapsed ? "展開側邊欄" : "收合側邊欄"}
        >{collapsed ? "›" : "‹"}</button>
      </div>

      <nav className="sidebar-body">
        {!collapsed && manualOrder && manualOrder.length > 0 && (
          <button className="sidebar-reset" onClick={() => setManualOrder(null)}>↺ 重設為自動排序</button>
        )}

        {active.length === 0 && closed.length === 0 && !collapsed && (
          <div className="sidebar-empty">尚無案件<br />點下方按鈕新增</div>
        )}

        {active.length > 0 && !collapsed && (
          <div className="sidebar-section-title">進行中 · {active.length}</div>
        )}
        {active.map((inc, idx) => renderCard(inc, idx, false))}

        {closed.length > 0 && (
          <>
            <div className="sidebar-divider" />
            {!collapsed && <div className="sidebar-section-title">已結案 · {closed.length}</div>}
            {closed.map((inc, idx) => renderCard(inc, idx, true))}
          </>
        )}
      </nav>

      <div className="sidebar-footer">
        <button className="sidebar-new-btn" onClick={onNew} aria-label="新增案件" title="新增案件">
          <span aria-hidden="true">＋</span>
          <span className="sidebar-new-btn-text">新增案件</span>
        </button>
      </div>
    </aside>
  );
}

function SidebarCaseCard({ incident, summary, active, onClick, canUp, canDown, onUp, onDown }) {
  const { typeConf, total, done, closed, urgent, status, tone } = summary;
  const days = closed ? null : describeDays(status?.days);

  let cardClass = "sb-case-card";
  if (active) cardClass += " active";
  if (closed) cardClass += " closed";
  else if (tone === "overdue" || tone === "soon") cardClass += " " + tone;

  return (
    <div className="sb-item">
      <button
        type="button"
        className={cardClass}
        style={{ borderLeftColor: TONE_COLOR[tone] || typeConf.color }}
        onClick={onClick}
        aria-current={active ? "page" : undefined}
        title={incident.name}
      >
        <div className="sb-row1">
          <span className="sb-icon" aria-hidden="true">{typeConf.icon}</span>
          <span className="sb-name">{truncate(incident.name, 10)}</span>
        </div>
        {closed ? (
          <div className="sb-meta">🏁 已結案</div>
        ) : urgent ? (
          <div className="sb-meta">下一步：{truncate(urgent.name, 14)}</div>
        ) : (
          <div className="sb-meta">✅ 所有步驟完成</div>
        )}
        <div className="sb-progress">
          <span>{done} / {total} 步</span>
          {days && <span className={"sb-days " + days.tone}>{days.text}</span>}
        </div>
      </button>
      {(onUp || onDown) && (
        <div className="sb-order-btns">
          <button onClick={onUp} disabled={!canUp} aria-label={`將「${incident.name}」上移`} title="上移">▲</button>
          <button onClick={onDown} disabled={!canDown} aria-label={`將「${incident.name}」下移`} title="下移">▼</button>
        </div>
      )}
    </div>
  );
}

function SidebarIconCard({ incident, summary, active, onClick }) {
  const { typeConf, closed, tone } = summary;
  let cls = "sb-icon-card";
  if (active) cls += " active";
  if (closed) cls += " closed";
  else if (tone === "overdue" || tone === "soon") cls += " " + tone;
  const label = incident.name + (closed ? "（已結案）" : "");
  return (
    <button
      type="button"
      className={cls}
      style={{ borderLeftColor: TONE_COLOR[tone] || typeConf.color }}
      onClick={onClick}
      aria-current={active ? "page" : undefined}
      aria-label={label}
      title={label}
    >
      <span aria-hidden="true">{typeConf.icon}</span>
    </button>
  );
}

/* ==========================================================
   自我檢測（網址加上 ?selftest 執行）
========================================================== */

function runSelfTests() {
  const results = [];
  const eq = (name, actual, expected) => {
    const ok = JSON.stringify(actual) === JSON.stringify(expected);
    results.push({ name, ok, detail: ok ? "" : `預期 ${JSON.stringify(expected)}，實際 ${JSON.stringify(actual)}` });
  };
  const ymd = d => toDateInputValue(d);
  const d = s => parseDate(s);

  // 工作日 / 日曆天
  eq("工作日：週五 +1 → 週一", ymd(addWorkDays(d("2026-10-23"), 1)), "2026-10-26");
  eq("工作日：週一 +5 → 下週一", ymd(addWorkDays(d("2026-10-19"), 5)), "2026-10-26");
  eq("工作日：週六 +1 → 週一", ymd(addWorkDays(d("2026-10-24"), 1)), "2026-10-26");
  eq("工作日：+0 為當天", ymd(addWorkDays(d("2026-10-23"), 0)), "2026-10-23");
  eq("工作日：+20 跨月", ymd(addWorkDays(d("2026-10-01"), 20)), "2026-10-29");
  eq("日曆天：跨年", ymd(addCalendarDays(d("2026-12-30"), 3)), "2027-01-02");
  eq("天數差", diffCalendarDays(d("2026-10-22"), d("2026-10-25")), 3);

  // 日期解析
  eq("不存在的日期回傳 null", parseDate("2026-02-30"), null);
  eq("格式錯誤回傳 null", parseDate("2026/10/22"), null);
  eq("日期顯示格式", fmtDate(d("2026-05-01")), "2026/05/01");

  // 狀態判斷
  const conf = INCIDENT_TYPES.gender;
  const base = { id: "t", type: "gender", incidentDate: "2026-10-01", checkedSteps: {}, status: "active" };
  const today = d("2026-10-22");
  const step4 = conf.steps.find(s => s.id === 4);   // +3 日 → 10/04
  const step5 = conf.steps.find(s => s.id === 5);   // +20 日 → 10/21
  const step6 = conf.steps.find(s => s.id === 6);   // +25 日 → 10/26
  const step7 = conf.steps.find(s => s.id === 7);   // +40 日 → 11/10
  eq("已勾選 → 已完成", getStepStatus(conf, step4, { ...base, checkedSteps: { 4: true } }, today).key, "done");
  eq("截止日已過 → 逾期", getStepStatus(conf, step5, base, today), { key: "overdue", label: "逾期", days: -1 });
  eq("4 天內 → 待辦（>3 天）", getStepStatus(conf, step6, base, today).key, "todo");
  eq("3 天內 → 即將到期", getStepStatus(conf, step6, base, d("2026-10-23")).key, "soon");
  eq("遠期 → 待辦", getStepStatus(conf, step7, base, today).key, "todo");
  eq("已結案未勾選 → 未完成（不計逾期）", getStepStatus(conf, step5, { ...base, status: "closed" }, today), { key: "todo", label: "未完成" });

  // 食物中毒小時制
  const fp = INCIDENT_TYPES.food_poison;
  eq("立即", formatDeadline(fp, fp.steps[0], "2026-10-22"), "立即（事件當下）");
  eq("15 分鐘", formatDeadline(fp, fp.steps[2], "2026-10-22"), "15 分鐘內");
  eq("2 小時", formatDeadline(fp, fp.steps[5], "2026-10-22"), "2 小時內（2026/10/22）");

  // 剩餘天數文字
  eq("已逾文字", describeDays(-2), { text: "已逾 2 天", tone: "overdue" });
  eq("今日截止", describeDays(0), { text: "今日截止", tone: "soon" });

  // 匯出安全
  eq("CSV 公式注入防護", csvCell("=HYPERLINK(1)"), "\"'=HYPERLINK(1)\"");
  eq("CSV 引號跳脫", csvCell('a"b'), '"a""b"');
  eq("檔名不合法字元", safeFileName('a/b:c*?'), "a_b_c__");
  const csv = buildCaseCsv({ ...base, notes: { 1: "第一行\n第二行" } }, conf, today);
  eq("CSV 含 BOM", csv.charCodeAt(0), 0xFEFF);
  eq("CSV 列數 = 步驟數 + 標題", csv.split("\r\n").length, conf.steps.length + 1);

  // 資料正規化
  eq("損毀紀錄剔除", normalizeIncident({ id: "x" }), null);
  const n = normalizeIncident({ id: "x", type: "gender", incidentDate: "2026-10-01", checkedSteps: { 1: true, 2: "yes" } });
  eq("補齊欄位", [n.status, n.notes, n.activityLog, n.checkedSteps], ["active", {}, [], { 1: true }]);
  eq("重複 ID 去除", normalizeIncidentList([{ id: "a", incidentDate: "2026-01-01" }, { id: "a", incidentDate: "2026-01-02" }]).length, 1);

  // 側邊欄排序
  const incs = [
    { ...base, id: "a" },
    { ...base, id: "b", incidentDate: "2026-06-01" },
    { ...base, id: "c", status: "closed" }
  ];
  const sums = new Map(incs.map(i => [i.id, summarizeIncident(i, today)]));
  eq("自動排序：逾期較久者在前", getSidebarOrderedActive(incs, sums, null).map(i => i.id), ["b", "a"]);
  eq("手動排序優先、結案排除", getSidebarOrderedActive(incs, sums, ["a", "c"]).map(i => i.id), ["a", "b"]);
  eq("結案摘要不顯示緊急步驟", [sums.get("c").tone, sums.get("c").status], ["done", null]);

  return results;
}

function SelfTestPanel() {
  const results = useMemo(runSelfTests, []);
  const failed = results.filter(r => !r.ok);
  useEffect(() => {
    console.log(`[自我檢測] ${results.length - failed.length}/${results.length} 通過`, failed);
  }, []);
  return (
    <section className="selftest" aria-label="自我檢測結果">
      <h3 className={failed.length ? "fail" : "pass"}>
        自我檢測：{results.length - failed.length} / {results.length} 通過
      </h3>
      <ul>
        {results.map(r => (
          <li key={r.name} className={r.ok ? "pass" : "fail"}>{r.ok ? "✓" : "✗"} {r.name}{r.detail ? `：${r.detail}` : ""}</li>
        ))}
      </ul>
    </section>
  );
}
